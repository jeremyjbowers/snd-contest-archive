# SND Archive production, on the DigitalOcean Archives team.
# App name snd-archives-webapp-production. Deploys the prod branch.
# Do not point this app at main.
#
# Web service is 1 GiB ($12/month), one step above staging's 512 MiB, because
# the Node process builds the SvelteKit app and serves preview images out of
# Postgres. The migrate job stays at 512 MiB and is billed only while it runs.
# Postgres is the existing Premium AMD cluster snd-archive-pg, resized to
# 2 GiB / 1 vCPU (about $37/month) so the buffer cache can hold more of the
# ~6 GiB media catalog. One node, no standby.
# The app must use defaultdb / doadmin, where that copy was loaded.
name: snd-archives-webapp-production
region: nyc
alerts:
  - rule: DEPLOYMENT_FAILED

envs:
  - key: NODE_ENV
    scope: RUN_TIME
    value: production
  - key: NPM_CONFIG_PRODUCTION
    scope: BUILD_TIME
    value: 'false'
  - key: CATALOG_URL
    scope: RUN_TIME
    value: '${snd-db.DATABASE_URL}'

services:
  - name: web
    github:
      repo: jeremyjbowers/snd-contest-archive
      branch: prod
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm install --include=dev && npm run build
    run_command: node build/index.js
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    envs:
      - key: HOST
        scope: RUN_TIME
        value: 0.0.0.0
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 5

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: jeremyjbowers/snd-contest-archive
      branch: prod
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm install --include=dev
    run_command: npx tsx scripts/migrate.ts
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

databases:
  - name: snd-db
    engine: PG
    version: '16'
    production: true
    cluster_name: snd-archive-pg
    db_name: defaultdb
    db_user: doadmin

ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
